<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Short 1: AI Speech & Fluency Radar - 60FPS Studio Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #020617;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    overflow-x: hidden;
  }
  .container {
    max-width: 1280px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .header {
    text-align: center;
  }
  h1 {
    font-size: 26px;
    font-weight: 900;
    color: #2dd4bf;
    letter-spacing: -0.5px;
  }
  p {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 4px;
  }
  .canvas-container {
    position: relative;
    width: 100%;
    max-width: 1080px;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 25px 60px -15px rgba(13, 148, 136, 0.3), 0 0 0 1px rgba(45, 212, 191, 0.2);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  button {
    padding: 14px 28px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-record {
    background: linear-gradient(135deg, #14b8a6, #0284c7);
    color: #020617;
    box-shadow: 0 10px 25px -5px rgba(20, 184, 166, 0.5);
  }
  .btn-record:hover {
    transform: scale(1.04);
    box-shadow: 0 15px 30px -5px rgba(20, 184, 166, 0.7);
  }
  .btn-stop {
    background: #ef4444;
    color: #ffffff;
    display: none;
  }
  .format-toggle {
    background: #0f172a;
    border: 1px solid #334155;
    padding: 4px;
    border-radius: 12px;
    display: flex;
    gap: 4px;
  }
  .format-btn {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    background: transparent;
    color: #94a3b8;
    border: none;
    cursor: pointer;
  }
  .format-btn.active {
    background: #14b8a6;
    color: #020617;
  }
  .status-badge {
    padding: 10px 20px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #334155;
    font-size: 13px;
    font-weight: 700;
    font-family: monospace;
    color: #cbd5e1;
  }
  .rec-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ef4444;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎬 Short 01: AI Speech & Fluency Radar (Band 8.5)</h1>
    <p>64-Band Radial Equalizer • Live Speech Typing • 360° Radar Gauge Lock • Gold Particle Burst</p>
  </div>

  <div class="format-toggle">
    <button id="fmt169" class="format-btn active">Landscape (16:9 - YouTube/FB)</button>
    <button id="fmt916" class="format-btn">Vertical (9:16 - Shorts/Reels/TikTok)</button>
  </div>

  <div class="canvas-container" id="canvasBox">
    <canvas id="stage" width="1920" height="1080"></canvas>
  </div>

  <div class="controls">
    <button id="recordBtn" class="btn-record">
      <span>🚀 Record & Download 60FPS Video</span>
    </button>
    <button id="stopBtn" class="btn-stop">
      <span>⏹️ Stop & Save Video</span>
    </button>
    <div id="statusBadge" class="status-badge">
      Ready • 1920x1080 @ 60 FPS
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const recordBtn = document.getElementById('recordBtn');
const stopBtn = document.getElementById('stopBtn');
const statusBadge = document.getElementById('statusBadge');
const fmt169 = document.getElementById('fmt169');
const fmt916 = document.getElementById('fmt916');
const canvasBox = document.getElementById('canvasBox');

let isVertical = false;
let isRecording = false;
let mediaRecorder = null;
let recordedChunks = [];
let startTime = performance.now();

// Gold Particle Explosion Array
let goldParticles = [];
function spawnGoldBurst(x, y, count = 120) {
  goldParticles = [];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 12 + 4;
    goldParticles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 6 + 2,
      alpha: 1.0,
      decay: Math.random() * 0.02 + 0.015,
      color: Math.random() > 0.3 ? '#fbbf24' : '#fef08a'
    });
  }
}

// Background Floating Ambience Particles
const ambientParticles = Array.from({ length: 70 }, () => ({
  x: Math.random() * 1920,
  y: Math.random() * 1080,
  r: Math.random() * 3 + 1,
  vx: (Math.random() - 0.5) * 0.6,
  vy: (Math.random() - 0.5) * 0.6,
  alpha: Math.random() * 0.4 + 0.1
}));

const DURATION = 22; // 22 seconds high-energy short video
const TRANSCRIPT_TEXT = "The fundamental consequence of international trade corridors is their ability to bridge systemic economic disparities across emerging market economies...";

function drawShortFrame(t) {
  const w = canvas.width;
  const h = canvas.height;
  const time = t % DURATION;

  // 1. Deep Volumetric Background Gradient
  const bgGrad = ctx.createRadialGradient(w * 0.5, h * 0.4, 80, w * 0.5, h * 0.5, Math.max(w, h));
  bgGrad.addColorStop(0, '#0f766e');
  bgGrad.addColorStop(0.35, '#0f172a');
  bgGrad.addColorStop(1, '#020617');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  // 2. Ambient Particles
  ambientParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
    if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(45, 212, 191, ${p.alpha})`;
    ctx.fill();
  });

  // 3. Top Header Hook & Brand
  ctx.save();
  ctx.fillStyle = 'rgba(20, 184, 166, 0.15)';
  ctx.strokeStyle = '#2dd4bf';
  ctx.lineWidth = 2;
  const badgeW = isVertical ? 650 : 500;
  const badgeX = (w - badgeW) / 2;
  const badgeY = isVertical ? 100 : 70;
  ctx.beginPath();
  ctx.roundRect(badgeX, badgeY, badgeW, 46, 23);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#2dd4bf';
  ctx.beginPath();
  ctx.arc(badgeX + 28, badgeY + 23, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = 'bold 18px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('DHSHISHIR.COM • AI SPEECH LAB', w / 2 + 10, badgeY + 29);
  ctx.textAlign = 'left';

  // Dynamic Headline Hook
  ctx.textAlign = 'center';
  ctx.font = isVertical ? '900 48px -apple-system, sans-serif' : '900 52px -apple-system, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('Stop Paying for Speaking Mock Tests!', w / 2, isVertical ? 210 : 170);

  ctx.font = isVertical ? '700 24px -apple-system, sans-serif' : '700 24px -apple-system, sans-serif';
  ctx.fillStyle = '#38bdf8';
  ctx.fillText('Get Instant Band 8.5 Fluency, Lexical & Pronunciation Feedback', w / 2, isVertical ? 260 : 215);
  ctx.textAlign = 'left';
  ctx.restore();

  // 4. Center 3D Glowing Studio Microphone & 64-Band Radial Equalizer
  const micCenterX = isVertical ? w / 2 : w * 0.32;
  const micCenterY = isVertical ? h * 0.42 : h * 0.56;
  const micRadius = isVertical ? 90 : 110;

  // Concentric Expanding Energy Rings
  for (let r = 1; r <= 3; r++) {
    const ringPulse = ((time * 2 + r * 0.35) % 1);
    const ringRadius = micRadius + ringPulse * 160;
    const ringAlpha = (1 - ringPulse) * 0.4;
    ctx.strokeStyle = `rgba(45, 212, 191, ${ringAlpha})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(micCenterX, micCenterY, ringRadius, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 64-Band Radial Audio Spectrum Bars
  const numBars = 64;
  for (let i = 0; i < numBars; i++) {
    const angle = (i / numBars) * Math.PI * 2;
    // Harmonic frequency wave calculation
    const freq = Math.abs(Math.sin(time * 8 + i * 0.3)) * 0.6 + Math.abs(Math.cos(time * 12 + i * 0.5)) * 0.4;
    const barLength = freq * 65 + 10;
    
    const x1 = micCenterX + Math.cos(angle) * (micRadius + 15);
    const y1 = micCenterY + Math.sin(angle) * (micRadius + 15);
    const x2 = micCenterX + Math.cos(angle) * (micRadius + 15 + barLength);
    const y2 = micCenterY + Math.sin(angle) * (micRadius + 15 + barLength);

    const barGrad = ctx.createLinearGradient(x1, y1, x2, y2);
    barGrad.addColorStop(0, '#14b8a6');
    barGrad.addColorStop(1, '#38bdf8');

    ctx.strokeStyle = barGrad;
    ctx.lineWidth = isVertical ? 3.5 : 4.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // Central Glowing Mic Orb
  const orbGrad = ctx.createRadialGradient(micCenterX - 20, micCenterY - 20, 10, micCenterX, micCenterY, micRadius);
  orbGrad.addColorStop(0, '#14b8a6');
  orbGrad.addColorStop(0.6, '#0f766e');
  orbGrad.addColorStop(1, '#042f2e');
  ctx.fillStyle = orbGrad;
  ctx.beginPath();
  ctx.arc(micCenterX, micCenterY, micRadius, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#2dd4bf';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Microphone Icon inside Orb
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(micCenterX - 18, micCenterY - 35, 36, 48, 18);
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 4.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(micCenterX, micCenterY - 10, 30, 0, Math.PI);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(micCenterX, micCenterY + 20);
  ctx.lineTo(micCenterX, micCenterY + 40);
  ctx.moveTo(micCenterX - 20, micCenterY + 40);
  ctx.lineTo(micCenterX + 20, micCenterY + 40);
  ctx.stroke();

  // Live Rec Badge
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.roundRect(micCenterX - 45, micCenterY + 70, 90, 26, 13);
  ctx.fill();

  ctx.font = 'bold 12px monospace';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.fillText('● LIVE REC', micCenterX, micCenterY + 87);
  ctx.textAlign = 'left';

  // 5. Right Side: Real-Time Typewriter Speech & 360° Radar Lock
  const panelX = isVertical ? 80 : w * 0.58;
  const panelY = isVertical ? h * 0.62 : 280;
  const panelW = isVertical ? w - 160 : 660;

  // Real-time Typewriter Speech Box
  ctx.save();
  ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
  ctx.strokeStyle = 'rgba(51, 65, 85, 0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(panelX, panelY, panelW, 140, 16);
  ctx.fill();
  ctx.stroke();

  ctx.font = 'bold 13px -apple-system, sans-serif';
  ctx.fillStyle = '#2dd4bf';
  ctx.fillText('LIVE CANDIDATE SPEECH TRANSCRIPTION:', panelX + 24, panelY + 34);

  // Typewriter text logic
  const charCount = Math.floor(Math.min(TRANSCRIPT_TEXT.length, time * 12));
  const currentText = TRANSCRIPT_TEXT.substring(0, charCount);
  
  ctx.font = '500 17px -apple-system, sans-serif';
  ctx.fillStyle = '#f1f5f9';
  
  // Wrap text cleanly in box
  const words = currentText.split(' ');
  let line = '';
  let lineY = panelY + 68;
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + ' ';
    const metrics = ctx.measureText(testLine);
    if (metrics.width > panelW - 50 && n > 0) {
      ctx.fillText(line, panelX + 24, lineY);
      line = words[n] + ' ';
      lineY += 26;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line + (Math.sin(time * 10) > 0 ? '|' : ''), panelX + 24, lineY);
  ctx.restore();

  // 6. Dynamic Radar Sweep & Overall Band 8.5 Lock Meter
  const radarY = panelY + 165;
  
  ctx.save();
  ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(panelX, radarY, panelW, 280, 20);
  ctx.fill();
  ctx.stroke();

  // Check if Radar Locked (after 4 seconds)
  const isLocked = time >= 4.0;
  if (isLocked && goldParticles.length === 0 && time < 4.2) {
    spawnGoldBurst(panelX + 110, radarY + 110, 140);
  }

  // Radar Dial
  const dialX = panelX + 110;
  const dialY = radarY + 110;
  const dialRadius = 75;

  ctx.strokeStyle = 'rgba(45, 212, 191, 0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(dialX, dialY, dialRadius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(dialX, dialY, dialRadius * 0.6, 0, Math.PI * 2);
  ctx.stroke();

  // Radar Sweeping Line
  if (!isLocked) {
    const sweepAngle = (time * 6) % (Math.PI * 2);
    ctx.strokeStyle = '#2dd4bf';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(dialX, dialY);
    ctx.lineTo(dialX + Math.cos(sweepAngle) * dialRadius, dialY + Math.sin(sweepAngle) * dialRadius);
    ctx.stroke();
  } else {
    // Locked on Target
    ctx.fillStyle = 'rgba(245, 158, 11, 0.2)';
    ctx.beginPath();
    ctx.arc(dialX, dialY, dialRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 3.5;
    ctx.stroke();
  }

  // Band Score Text in Dial
  ctx.textAlign = 'center';
  ctx.font = '900 36px -apple-system, sans-serif';
  ctx.fillStyle = isLocked ? '#fbbf24' : '#2dd4bf';
  ctx.fillText(isLocked ? '8.5' : 'SCAN', dialX, dialY + 12);

  ctx.font = 'bold 11px -apple-system, sans-serif';
  ctx.fillStyle = isLocked ? '#fef08a' : '#94a3b8';
  ctx.fillText(isLocked ? 'BAND SCORE' : 'ANALYZING', dialX, dialY + 30);
  ctx.textAlign = 'left';

  // 4 Assessment Criteria Metric Bars
  const metrics = [
    { name: "Fluency & Coherence", score: 8.5, pct: 94 },
    { name: "Lexical Resource (C1/C2)", score: 9.0, pct: 100 },
    { name: "Grammatical Range", score: 8.5, pct: 94 },
    { name: "Pronunciation & Pacing", score: 8.5, pct: 94 }
  ];

  const barsX = panelX + 220;
  const barW = panelW - 250;
  
  metrics.forEach((m, idx) => {
    const bY = radarY + 40 + idx * 56;
    const progressFill = isLocked ? Math.min(1, (time - 4.0) * 3) : 0;

    ctx.font = 'bold 14px -apple-system, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(m.name, barsX, bY);

    ctx.fillStyle = '#2dd4bf';
    ctx.font = 'bold 14px -apple-system, sans-serif';
    ctx.fillText(isLocked ? `${m.score}` : '--', barsX + barW - 35, bY);

    // Track
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.roundRect(barsX, bY + 8, barW, 10, 5);
    ctx.fill();

    // Fill
    if (isLocked) {
      const fillW = (barW * (m.pct / 100)) * progressFill;
      const fGrad = ctx.createLinearGradient(barsX, 0, barsX + fillW, 0);
      fGrad.addColorStop(0, '#14b8a6');
      fGrad.addColorStop(1, '#38bdf8');
      ctx.fillStyle = fGrad;
      ctx.beginPath();
      ctx.roundRect(barsX, bY + 8, fillW, 10, 5);
      ctx.fill();
    }
  });

  ctx.restore();

  // 7. Render Gold Particles Burst
  goldParticles.forEach((gp, index) => {
    gp.x += gp.vx;
    gp.y += gp.vy;
    gp.vy += 0.2; // gravity
    gp.alpha -= gp.decay;

    if (gp.alpha > 0) {
      ctx.fillStyle = gp.color;
      ctx.globalAlpha = gp.alpha;
      ctx.beginPath();
      ctx.arc(gp.x, gp.y, gp.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    } else {
      goldParticles.splice(index, 1);
    }
  });

  // 8. Bottom Brand Call-To-Action Banner
  ctx.save();
  const bottomH = isVertical ? 140 : 100;
  ctx.fillStyle = '#020617';
  ctx.fillRect(0, h - bottomH, w, bottomH);

  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, h - bottomH);
  ctx.lineTo(w, h - bottomH);
  ctx.stroke();

  // Timeline Progress
  ctx.fillStyle = '#14b8a6';
  ctx.fillRect(0, h - bottomH - 4, w * (time / DURATION), 4);

  // Footer text
  ctx.font = 'bold 24px -apple-system, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('dhshishir.com', isVertical ? 60 : 100, h - bottomH + (isVertical ? 50 : 58));

  ctx.font = '16px -apple-system, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('• 100% Free AI Speech & Fluency Lab', isVertical ? 60 : 280, h - bottomH + (isVertical ? 80 : 58));

  // CTA Pill
  ctx.fillStyle = '#14b8a6';
  ctx.beginPath();
  ctx.roundRect(w - (isVertical ? 260 : 320), h - bottomH + (isVertical ? 40 : 25), isVertical ? 200 : 240, 50, 14);
  ctx.fill();

  ctx.font = 'bold 18px -apple-system, sans-serif';
  ctx.fillStyle = '#020617';
  ctx.textAlign = 'center';
  ctx.fillText('Try Free Now ➔', w - (isVertical ? 160 : 200), h - bottomH + (isVertical ? 72 : 56));
  ctx.textAlign = 'left';

  ctx.restore();
}

function renderLoop() {
  const current = (performance.now() - startTime) / 1000;
  drawShortFrame(current);
  requestAnimationFrame(renderLoop);
}

renderLoop();

// Format Switching Logic
fmt169.addEventListener('click', () => {
  isVertical = false;
  fmt169.classList.add('active');
  fmt916.classList.remove('active');
  canvas.width = 1920;
  canvas.height = 1080;
  canvasBox.style.aspectRatio = '16 / 9';
  canvasBox.style.maxWidth = '1080px';
  statusBadge.innerText = 'Ready • 1920x1080 (Landscape 16:9)';
});

fmt916.addEventListener('click', () => {
  isVertical = true;
  fmt916.classList.add('active');
  fmt169.classList.remove('active');
  canvas.width = 1080;
  canvas.height = 1920;
  canvasBox.style.aspectRatio = '9 / 16';
  canvasBox.style.maxWidth = '450px';
  statusBadge.innerText = 'Ready • 1080x1920 (Vertical 9:16 Shorts/Reels)';
});

// Recording Logic
recordBtn.addEventListener('click', () => {
  if (isRecording) return;
  isRecording = true;
  recordedChunks = [];
  startTime = performance.now();
  recordBtn.style.display = 'none';
  stopBtn.style.display = 'inline-flex';
  statusBadge.innerHTML = '<span class="rec-dot"></span> Recording 60 FPS Video Stream... (0s / 22s)';

  const stream = canvas.captureStream(60);
  let mime = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

  mediaRecorder = new MediaRecorder(stream, {
    mimeType: mime,
    videoBitsPerSecond: 16000000 // 16 Mbps ultra crisp
  });

  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = isVertical 
      ? 'dhshishir-short01-ai-speech-radar-vertical-9x16.webm' 
      : 'dhshishir-short01-ai-speech-radar-landscape-16x9.webm';
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);

    isRecording = false;
    recordBtn.style.display = 'inline-flex';
    stopBtn.style.display = 'none';
    statusBadge.innerHTML = '✅ Video Downloaded Successfully! (1080p 60 FPS)';
  };

  mediaRecorder.start(100);

  const tInt = setInterval(() => {
    if (!isRecording) { clearInterval(tInt); return; }
    const elapsed = Math.floor((performance.now() - startTime) / 1000);
    statusBadge.innerHTML = `<span class="rec-dot"></span> Recording 60 FPS Video Stream... (${elapsed}s / ${DURATION}s)`;
    if (elapsed >= DURATION) {
      clearInterval(tInt);
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    }
  }, 500);
});

stopBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
});
</script>

</body>
</html>
