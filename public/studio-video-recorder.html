<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dhshishir.com - 1080p 60FPS Video Production Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #020617;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 1200px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .header {
    text-align: center;
    space-y: 6px;
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    color: #2dd4bf;
  }
  p {
    font-size: 14px;
    color: #94a3b8;
  }
  .canvas-wrapper {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(51, 65, 85, 0.6);
    background: #000;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  button {
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #14b8a6, #0284c7);
    color: #020617;
    box-shadow: 0 10px 20px -5px rgba(20, 184, 166, 0.4);
  }
  .btn-primary:hover {
    transform: scale(1.04);
    box-shadow: 0 15px 25px -5px rgba(20, 184, 166, 0.6);
  }
  .btn-secondary {
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid #334155;
  }
  .btn-secondary:hover {
    background: #334155;
  }
  .status-badge {
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid #334155;
    font-size: 13px;
    font-weight: 600;
    color: #cbd5e1;
    font-family: monospace;
  }
  .recording-indicator {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ef4444;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎬 dhshishir.com 1080p 60FPS Broadcast Video Generator</h1>
    <p>Silky-smooth 60 FPS animations, glowing radars, live waveforms, and crystal-clear graphics for YouTube, Facebook & TikTok</p>
  </div>

  <div class="canvas-wrapper">
    <canvas id="videoCanvas" width="1920" height="1080"></canvas>
  </div>

  <div class="controls">
    <button id="recordBtn" class="btn-primary">
      <span>🚀 Record & Auto-Download 60FPS Video</span>
    </button>
    <button id="previewBtn" class="btn-secondary">
      <span>▶️ Preview Animation Loop</span>
    </button>
    <button id="stopBtn" class="btn-secondary" style="display:none;">
      <span>⏹️ Stop & Save Now</span>
    </button>
    <div id="statusBadge" class="status-badge">
      Ready • 1920x1080 @ 60 FPS
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('videoCanvas');
const ctx = canvas.getContext('2d');
const recordBtn = document.getElementById('recordBtn');
const previewBtn = document.getElementById('previewBtn');
const stopBtn = document.getElementById('stopBtn');
const statusBadge = document.getElementById('statusBadge');

let isRecording = false;
let isPreviewing = true;
let mediaRecorder = null;
let recordedChunks = [];
let animFrameId = null;
let startTime = performance.now();

// 6 Broadcast Scenes Definition
const SCENES = [
  {
    badge: "DHSHISHIR.COM • GLOBAL ACADEMIC PORTAL",
    tagline: "100% FREE OPEN ACCESS • ZERO SUBSCRIPTIONS",
    title: "Master IELTS Band 8.5+ & Academic Statecraft",
    subtitle: "Stop spending thousands on coaching. Experience Bangladesh's premier AI-powered learning portal.",
    cards: [
      { title: "AI Speech Recognition Lab", sub: "Live microphone feedback with Band 8.5 radar breakdown" },
      { title: "Band 9 Essay Examiner", sub: "Instant academic vocabulary and syntactic analysis" },
      { title: "20+ Master's IR Lectures", sub: "Comprehensive geopolitical treatises and case studies" }
    ],
    duration: 8 // seconds
  },
  {
    badge: "SPEAKING MODULE • AI SPEECH LAB",
    tagline: "REAL-TIME MICROPHONE RECOGNITION & SCORING",
    title: "Instant Fluency, Pronunciation & Lexical Scoring",
    subtitle: "Speak directly into your mic and get immediate Cambridge-aligned scoring criteria.",
    cards: [
      { title: "Fluency & Coherence: 8.5", sub: "Pacing tracker, discourse markers, and natural flow" },
      { title: "Lexical Resource: 9.0", sub: "Advanced C1/C2 academic collocations and upgrades" },
      { title: "Grammar & Accuracy: 8.5", sub: "Complex clause structures and syntactic variety" }
    ],
    duration: 8
  },
  {
    badge: "FULL 4-SKILL PREPARATION SUITE",
    tagline: "WRITING • READING • LISTENING • 1,200+ VOCAB VAULT",
    title: "Conquer Every Section with Interactive Tools",
    subtitle: "From Band 9 essay models to high-speed academic reading drills and multi-accent listening tests.",
    cards: [
      { title: "Writing Task 1 & 2 Evaluator", sub: "Interactive chart morpher and argumentative scoring" },
      { title: "Academic Reading Drills", sub: "True/False/Not Given traps and skimming timers" },
      { title: "Multi-Accent Audio Simulator", sub: "British, Australian, American, and Canadian accents" }
    ],
    duration: 8
  },
  {
    badge: "ACADEMIC DIPLOMACY & GEOPOLITICS",
    tagline: "STATECRAFT • CRISIS SIMULATIONS • MARITIME LAW",
    title: "Interactive Negotiation & Strategic Decision Simulators",
    subtitle: "Test your statecraft in high-stakes bilateral and multilateral foreign policy crises.",
    cards: [
      { title: "Bilateral Negotiation Game", sub: "Dynamic concession matrices and tactical scoring" },
      { title: "Geopolitical Risk Simulator", sub: "Maritime boundary and transboundary water scenarios" },
      { title: "200-Page IR Course Reader", sub: "Printable Master of Arts offline handbooks & treatises" }
    ],
    duration: 8
  },
  {
    badge: "VERIFIED CREDENTIALS & CLOUD SYNC",
    tagline: "SHA-256 CRYPTOGRAPHIC PROOF • 1-CLICK GOOGLE LOGIN",
    title: "Track Your Growth & Earn Verifiable Certificates",
    subtitle: "Sign in to persist your mock scores, save vocabulary, and share tamper-proof credentials.",
    cards: [
      { title: "1-Click Cloud Sync", sub: "Seamless progress tracking across all your devices" },
      { title: "Verifiable SHA-256 QR Hashes", sub: "Tamper-proof digital certificates of completion" },
      { title: "1-Click Handbooks (.DOC / PDF)", sub: "Comprehensive printable course materials" }
    ],
    duration: 8
  },
  {
    badge: "JOIN THOUSANDS OF LEARNERS WORLDWIDE",
    tagline: "DHSHISHIR.COM • FREE FOREVER • START TODAY",
    title: "Your Dream Band Score Is Just One Click Away",
    subtitle: "Start your journey today at dhshishir.com — Practice freely, prepare smartly, succeed globally.",
    cards: [
      { title: "Universal Device Access", sub: "Optimized for Desktop, Laptop, Tablet & Mobile" },
      { title: "100% Free Open Access", sub: "Zero credit cards • Built for global scholars" },
      { title: "Visit Now", sub: "https://dhshishir.com" }
    ],
    duration: 8
  }
];

const TOTAL_DURATION = SCENES.reduce((acc, s) => acc + s.duration, 0);

// Smooth Easing Functions
function easeInOutCubic(x) {
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

// Particle System for cinematic background
const particles = Array.from({ length: 60 }, () => ({
  x: Math.random() * 1920,
  y: Math.random() * 1080,
  radius: Math.random() * 3 + 1,
  vx: (Math.random() - 0.5) * 0.8,
  vy: (Math.random() - 0.5) * 0.8,
  alpha: Math.random() * 0.5 + 0.2
}));

function drawFrame(timeSeconds) {
  const t = timeSeconds % TOTAL_DURATION;

  // Determine active scene
  let accumulated = 0;
  let sceneIndex = 0;
  let sceneTime = 0;
  for (let i = 0; i < SCENES.length; i++) {
    if (t < accumulated + SCENES[i].duration) {
      sceneIndex = i;
      sceneTime = t - accumulated;
      break;
    }
    accumulated += SCENES[i].duration;
  }

  const scene = SCENES[sceneIndex];
  const progress = sceneTime / scene.duration;

  // 1. Draw Deep Luxury Background Gradient
  const grad = ctx.createRadialGradient(1600, 200, 50, 960, 540, 1200);
  grad.addColorStop(0, '#0f766e');
  grad.addColorStop(0.4, '#0f172a');
  grad.addColorStop(1, '#020617');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1920, 1080);

  // 2. Draw Moving Particle Grid
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = 1920;
    if (p.x > 1920) p.x = 0;
    if (p.y < 0) p.y = 1080;
    if (p.y > 1080) p.y = 0;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(45, 212, 191, ${p.alpha * 0.3})`;
    ctx.fill();
  });

  // 3. Draw Pulsing Geometric Accent Rings in Background
  const pulse = (Math.sin(timeSeconds * 2) + 1) / 2;
  ctx.strokeStyle = `rgba(45, 212, 191, ${0.05 + pulse * 0.05})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(1650, 300, 300 + pulse * 40, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(1650, 300, 450 + pulse * 60, 0, Math.PI * 2);
  ctx.stroke();

  // 4. Draw Header Badges with Entrance Animation
  const enterAlpha = Math.min(1, sceneTime * 3);
  ctx.save();
  ctx.globalAlpha = enterAlpha;

  // Top Left Badge
  ctx.fillStyle = 'rgba(20, 184, 166, 0.15)';
  ctx.strokeStyle = '#2dd4bf';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(140, 90, 440, 44, 22);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#2dd4bf';
  ctx.beginPath();
  ctx.arc(165, 112, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = 'bold 16px -apple-system, sans-serif';
  ctx.fillStyle = '#2dd4bf';
  ctx.fillText(scene.badge, 185, 118);

  // Top Right Scene Counter
  ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(1600, 90, 180, 44, 22);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#94a3b8';
  ctx.font = 'bold 16px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`SCENE 0${sceneIndex + 1} / 06`, 1690, 118);
  ctx.textAlign = 'left';

  // 5. Tagline & Main Title with Typewriter / Slide-in
  const titleOffset = (1 - Math.min(1, sceneTime * 2)) * 30;
  
  ctx.font = '800 20px -apple-system, sans-serif';
  ctx.fillStyle = '#38bdf8';
  ctx.fillText(scene.tagline, 140, 200 + titleOffset);

  ctx.font = '900 60px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(scene.title, 140, 275 + titleOffset);

  ctx.font = '500 25px -apple-system, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(scene.subtitle, 140, 330 + titleOffset);

  // 6. Draw 3 Highlight Cards with Staggered Slide In
  scene.cards.forEach((card, idx) => {
    const cardDelay = 0.3 + idx * 0.2;
    const cardProgress = Math.max(0, Math.min(1, (sceneTime - cardDelay) * 3));
    const cardAlpha = cardProgress;
    const cardY = 410 + idx * 160 + (1 - cardProgress) * 40;

    ctx.save();
    ctx.globalAlpha = cardAlpha;

    // Card Container
    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.strokeStyle = 'rgba(51, 65, 85, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(140, cardY, 1640, 130, 20);
    ctx.fill();
    ctx.stroke();

    // Left Check Icon / Radar Indicator
    const cardPulse = Math.sin(timeSeconds * 4 + idx) * 4;
    ctx.fillStyle = '#0d9488';
    ctx.beginPath();
    ctx.arc(200, cardY + 65, 24 + cardPulse * 0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(190, cardY + 65);
    ctx.lineTo(197, cardY + 72);
    ctx.lineTo(210, cardY + 58);
    ctx.stroke();

    // Card Title & Subtitle
    ctx.font = 'bold 28px -apple-system, sans-serif';
    ctx.fillStyle = '#2dd4bf';
    ctx.fillText(card.title, 250, cardY + 52);

    ctx.font = '20px -apple-system, sans-serif';
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText(card.sub, 250, cardY + 92);

    // Live Animated Waveform Bars on Right Side of Card
    for (let w = 0; w < 12; w++) {
      const waveHeight = Math.abs(Math.sin(timeSeconds * 6 + idx + w * 0.5)) * 40 + 10;
      ctx.fillStyle = '#14b8a6';
      ctx.fillRect(1680 - w * 12, cardY + 65 - waveHeight / 2, 6, waveHeight);
    }

    ctx.restore();
  });

  // 7. Bottom Brand Footer Bar & Progress Bar
  ctx.fillStyle = '#020617';
  ctx.fillRect(0, 960, 1920, 120);

  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 960);
  ctx.lineTo(1920, 960);
  ctx.stroke();

  // Progress Bar
  ctx.fillStyle = 'rgba(51, 65, 85, 0.5)';
  ctx.fillRect(0, 956, 1920, 6);

  ctx.fillStyle = '#14b8a6';
  ctx.fillRect(0, 956, 1920 * (t / TOTAL_DURATION), 6);

  // Footer Branding
  ctx.font = 'bold 28px -apple-system, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('dhshishir.com', 140, 1030);

  ctx.font = '20px -apple-system, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('• 100% Free Open Access IELTS & Academic Diplomacy Portal', 340, 1030);

  // Call to Action Badge
  ctx.fillStyle = '#14b8a6';
  ctx.beginPath();
  ctx.roundRect(1540, 990, 240, 56, 14);
  ctx.fill();

  ctx.font = 'bold 20px -apple-system, sans-serif';
  ctx.fillStyle = '#020617';
  ctx.textAlign = 'center';
  ctx.fillText('Start Free Now ➔', 1660, 1025);
  ctx.textAlign = 'left';

  ctx.restore();
}

function animateLoop() {
  const currentTime = (performance.now() - startTime) / 1000;
  drawFrame(currentTime);
  animFrameId = requestAnimationFrame(animateLoop);
}

// Start visual preview on page load
animateLoop();

// Recording Functionality
recordBtn.addEventListener('click', async () => {
  if (isRecording) return;

  isRecording = true;
  recordedChunks = [];
  startTime = performance.now();
  recordBtn.style.display = 'none';
  stopBtn.style.display = 'inline-flex';
  statusBadge.innerHTML = '<span class="recording-indicator"></span> Recording 60 FPS Video Stream... (0s / 48s)';

  // Setup Canvas Stream at 60 FPS
  const stream = canvas.captureStream(60);
  
  // Prefer high bitrate VP9/H.264 WebM/MP4
  let mimeType = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mimeType)) {
    mimeType = 'video/webm;codecs=vp8';
  }
  if (!MediaRecorder.isTypeSupported(mimeType)) {
    mimeType = 'video/webm';
  }

  mediaRecorder = new MediaRecorder(stream, {
    mimeType: mimeType,
    videoBitsPerSecond: 12000000 // 12 Mbps crystal clear Full HD
  });

  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) {
      recordedChunks.push(e.data);
    }
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = 'dhshishir-ielts-promotional-video-60fps-1080p.webm';
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);

    isRecording = false;
    recordBtn.style.display = 'inline-flex';
    stopBtn.style.display = 'none';
    statusBadge.innerHTML = '✅ Video Downloaded Successfully! (1080p 60 FPS)';
  };

  mediaRecorder.start(100);

  // Update timer during recording
  const timerInterval = setInterval(() => {
    if (!isRecording) {
      clearInterval(timerInterval);
      return;
    }
    const elapsed = Math.floor((performance.now() - startTime) / 1000);
    statusBadge.innerHTML = `<span class="recording-indicator"></span> Recording 60 FPS Video Stream... (${elapsed}s / ${TOTAL_DURATION}s)`;
    
    if (elapsed >= TOTAL_DURATION) {
      clearInterval(timerInterval);
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }
  }, 500);
});

stopBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
});
</script>

</body>
</html>
