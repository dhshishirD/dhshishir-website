<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" style="background:#FDFDFD; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="cardShadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064E3B" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Top Title Badge -->
  <g transform="translate(60, 50)">
    <rect width="960" height="130" rx="20" fill="url(#headerGrad3)" />
    <text x="480" y="55" fill="#A7F3D0" font-size="20" font-weight="700" letter-spacing="3" text-anchor="middle">IELTS SPEAKING BAND 8.5+ MASTERCLASS</text>
    <text x="480" y="98" fill="#FFFFFF" font-size="38" font-weight="800" text-anchor="middle">Intonation &amp; Pitch Contour Dynamics</text>
  </g>

  <!-- 3 Pitch Cards -->

  <!-- CARD 1: DEFINITIVE FALLING INTONATION (↘) -->
  <g transform="translate(60, 215)" filter="url(#cardShadow3)">
    <rect width="960" height="235" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect x="20" y="20" width="60" height="60" rx="12" fill="#ECFDF5" />
    <text x="50" y="58" fill="#059669" font-size="32" font-weight="900" text-anchor="middle">↘</text>
    
    <text x="95" y="45" fill="#065F46" font-size="22" font-weight="800">1. Definitive Falling Intonation (Certainty &amp; Closure)</text>
    <text x="95" y="72" fill="#64748B" font-size="14" font-weight="600">🎯 Used for conclusive facts, direct stances, and finishing a structured thought.</text>

    <!-- Visual Pitch Contour Wave -->
    <g transform="translate(20, 95)">
      <rect width="920" height="120" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <!-- Pitch line -->
      <path d="M 40 40 Q 250 20 500 50 T 880 95" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" />
      <circle cx="880" cy="95" r="7" fill="#059669" />
      <text x="40" y="32" fill="#0F172A" font-size="18" font-weight="700">"From where I stand, this policy is <tspan fill="#059669" font-weight="900">completely unjustified. ↘"</tspan></text>
      <text x="40" y="85" fill="#64748B" font-size="14" font-style="italic">Voice starts high on 'stand', remains level, and drops sharply on 'unjustified'.</text>
    </g>
  </g>

  <!-- CARD 2: LISTING RISING-RISING-FALLING (↗ ↗ ↘) -->
  <g transform="translate(60, 475)" filter="url(#cardShadow3)">
    <rect width="960" height="235" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect x="20" y="20" width="60" height="60" rx="12" fill="#EFF6FF" />
    <text x="50" y="58" fill="#2563EB" font-size="28" font-weight="900" text-anchor="middle">↗↘</text>
    
    <text x="95" y="45" fill="#1E40AF" font-size="22" font-weight="800">2. The 3-Item List Melody (Rise ↗, Rise ↗, Fall ↘)</text>
    <text x="95" y="72" fill="#64748B" font-size="14" font-weight="600">🎯 Demonstrates complex oral control when enumerating multiple reasons.</text>

    <!-- Visual Pitch Contour Wave -->
    <g transform="translate(20, 95)">
      <rect width="920" height="120" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <!-- Pitch line -->
      <path d="M 40 70 Q 180 20 280 40 Q 420 20 540 40 Q 700 30 880 95" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" />
      <circle cx="280" cy="40" r="6" fill="#2563EB" />
      <circle cx="540" cy="40" r="6" fill="#2563EB" />
      <circle cx="880" cy="95" r="7" fill="#2563EB" />
      <text x="40" y="32" fill="#0F172A" font-size="17" font-weight="700">"Governments must fund <tspan fill="#2563EB">schools ↗</tspan>, upgrade <tspan fill="#2563EB">hospitals ↗</tspan>, and fix <tspan fill="#1E40AF" font-weight="900">roads. ↘"</tspan></text>
      <text x="40" y="85" fill="#64748B" font-size="14" font-style="italic">Incomplete list items rise in pitch; the final item drops to signal completion.</text>
    </g>
  </g>

  <!-- CARD 3: CONCESSION FALL-RISE (↘↗) -->
  <g transform="translate(60, 735)" filter="url(#cardShadow3)">
    <rect width="960" height="235" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect x="20" y="20" width="60" height="60" rx="12" fill="#FFF7ED" />
    <text x="50" y="58" fill="#EA580C" font-size="28" font-weight="900" text-anchor="middle">↘↗</text>
    
    <text x="95" y="45" fill="#C2410C" font-size="22" font-weight="800">3. Concession &amp; Nuance Wave (Fall-Rise ↘↗)</text>
    <text x="95" y="72" fill="#64748B" font-size="14" font-weight="600">🎯 Used when conceding a point before introducing a counter-argument.</text>

    <!-- Visual Pitch Contour Wave -->
    <g transform="translate(20, 95)">
      <rect width="920" height="120" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <!-- Pitch line -->
      <path d="M 40 40 Q 250 85 450 35 Q 650 90 880 95" fill="none" stroke="#EA580C" stroke-width="5" stroke-linecap="round" />
      <circle cx="450" cy="35" r="6" fill="#EA580C" />
      <text x="40" y="32" fill="#0F172A" font-size="17" font-weight="700">"While that may <tspan fill="#EA580C" font-weight="800">sound plausible ↘↗</tspan>, practical implementation remains fraught."</text>
      <text x="40" y="85" fill="#64748B" font-size="14" font-style="italic">Voice dips and scoops back up on 'plausible' to create suspense and contrast.</text>
    </g>
  </g>

  <!-- Bottom Master Brand Signature Banner -->
  <g transform="translate(60, 1000)">
    <rect width="960" height="50" rx="12" fill="#064E3B" />
    <text x="40" y="32" fill="#F8FAFC" font-size="16" font-weight="700">🎓 IELTS 8.5 Lab by DH Shishir</text>
    <text x="920" y="32" fill="#A7F3D0" font-size="15" font-weight="700" text-anchor="end">🎙️ Speaking Flow Radar: dhshishir.com/ielts</text>
  </g>
</svg>
