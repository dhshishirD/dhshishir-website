name: Telegram Daily Fluency & IELTS Drills

on:
  schedule:
    # 10:30 AM BST (04:30 UTC) -> Morning Lexical Upgrade
    - cron: '30 4 * * *'
    # 03:30 PM BST (09:30 UTC) -> Afternoon Cambridge Quiz Poll
    - cron: '30 9 * * *'
    # 08:30 PM BST (14:30 UTC) -> Nightly Acoustic Speech Shadowing
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to dispatch'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - afternoon
          - evening

jobs:
  post-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dispatch Scheduled Drill
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8869531997:AAEn0Ld2pnnQg8ymnaIjkxh1-as4Ru7g8FU' }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '@ieltsenglishfluency' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/telegram-bot.js "${{ github.event.inputs.slot }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 7 ]; then
              node scripts/telegram-bot.js morning
            elif [ "$HOUR" -lt 12 ]; then
              node scripts/telegram-bot.js afternoon
            else
              node scripts/telegram-bot.js evening
            fi
          fi
